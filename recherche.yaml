# =============================================================================
#  recherche.yaml — Familles de requêtes de STAGE
# =============================================================================
#
# Une famille = un domaine visé. Chaque offre sera étiquetée avec la ou les
# familles dont une requête l'a fait remonter (provenance, pas classification :
# une famille ne dit pas ce qu'est l'offre, elle dit QUELLE QUESTION l'a trouvée).
#
# Termes COURTS, en français ET en anglais. Un même terme peut figurer dans les
# deux langues (« LLM », « MLOps ») ou dans deux familles : il n'est interrogé
# qu'une fois par source, et l'offre reçoit toutes les familles concernées.
#
# Les termes n'embarquent PAS « stage » / « internship » : chaque source ajoute
# le type de contrat à sa manière, selon ce que son moteur sait exprimer.
#
# ## Ce que chaque moteur sait exprimer (sondes du 2026-09-17, Île-de-France)
#
#   France Travail  `motsCles` est CONJONCTIF, virgule comme espace :
#                   vendeur 1 750, caissier 218, « vendeur,caissier » 8.
#                   Pas de OU -> un appel par terme.
#   Careerjet       OU supporté : vendeur 480, caissier 14, « vendeur OR
#                   caissier » 493. Espace = ET (« vendeur caissier » 1).
#                   Guillemets = phrase (machine learning 349, "…" 335).
#                   Parenthèses cohérentes -> un appel par famille.
#   Adzuna          `what_or` découpe sur les espaces : pas de OU de phrases
#                   (mesuré le 2026-09-05, cf. config.py).
#   Indeed/LinkedIn OU et guillemets documentés par JobSpy (non sondés : scraping).
#
# Validé au démarrage par `recherche.py` : une famille vide, un nom invalide ou
# une clé inconnue arrêtent le programme.
# =============================================================================

familles:

  ai_engineering:
    # « agents » seul attrape « agent de sécurité », « agent d'accueil »… : il
    # n'est interrogé qu'en phrase.
    fr: ["ingénieur IA", "intelligence artificielle", "IA générative", "agents IA", "LLM"]
    en: ["AI engineer", "LLM", "GenAI", "AI agents"]

  ml:
    fr: ["machine learning", "ingénieur machine learning", "apprentissage automatique",
         "deep learning", "data scientist", "data science", "NLP",
         "traitement automatique du langage", "vision par ordinateur",
         "ingénieur de recherche"]
    en: ["machine learning", "machine learning engineer", "deep learning",
         "data scientist", "data science", "NLP", "computer vision",
         "applied scientist", "research engineer"]

  mlops:
    fr: ["MLOps", "LLMOps", "plateforme ML", "infrastructure ML"]
    en: ["MLOps", "LLMOps", "ML platform", "ML infrastructure"]

  inference:
    fr: ["optimisation de l'inférence", "quantification", "GPU"]
    en: ["inference optimization", "model serving", "vLLM", "quantization", "GPU"]

  # Reprise des termes cyber de l'ancien `config.TERMES_RECHERCHE`
  # (« stage cybersécurité », « internship AI security ») : la famille existe
  # pour que la bascule vers les familles ne retire rien en silence.
  cyber:
    fr: ["cybersécurité", "sécurité de l'IA"]
    en: ["cybersecurity", "AI security"]


# =============================================================================
#  Jobs étudiants
# =============================================================================
#
# Une requête autour de chaque ORIGINE, dans un rayon. Le tri fin se fera sur
# le temps de trajet depuis n'importe quelle origine (CP6), jamais sur un code
# de département : le rayon ne sert qu'à borner ce qu'on demande aux sources.
#
# Chaque origine porte les formes que les sources comprennent — sondé le
# 2026-09-17 :
#   insee        France Travail (`commune`, jusqu'à 5 codes par appel)
#   code_postal  Adzuna — `where=Meaux` rend 0, `where=77100` rend des
#                offres ; son rayon par défaut est de 10 km
#   commune      Careerjet et Indeed, en toutes lettres
student_jobs:

  # Rayon autour de chaque origine, en km. Adzuna, temps partiel, 7 jours
  # (sondé le 2026-09-17) : Meaux 164 / 498 / 1 899 à 10 / 15 / 25 km,
  # Évry-Courcouronnes 38 / 94 / 519, Noisy-le-Grand 537 / 1 131 / 3 231.
  # L'écart réel des offres rendues suit le rayon demandé (+1 à 4 km).
  rayon_km: 15

  origines:
    ville_a:
      libelle: "Meaux"
      commune: "Meaux"
      insee: "77284"
      code_postal: "77100"
    ville_b:
      libelle: "Évry-Courcouronnes"
      commune: "Évry-Courcouronnes"
      insee: "91228"
      code_postal: "91000"
    campus:
      libelle: "ESIEE Paris (Noisy-le-Grand)"
      commune: "Noisy-le-Grand"
      insee: "93051"
      code_postal: "93160"

  # Termes, un par étiquette. Pas de filtre « temps partiel » côté source, sauf
  # la requête sans mot-clé de France Travail (ci-dessous) : les annonces de
  # job étudiant ne renseignent presque jamais la durée. Careerjet autour de
  # Meaux : 12 offres avec `contractperiod=p`, 108 avec une requête OU
  # de ces 16 termes et sans filtre.
  termes: ["étudiant", "job étudiant", "temps partiel", "mi-temps", "week-end",
           "extra", "saisonnier", "soirée", "vendeur", "équipier", "hôte de caisse",
           "préparateur de commandes", "serveur", "animateur", "soutien scolaire",
           "cours particuliers"]

